<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wallet - Deposito</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
        <link rel="stylesheet" href="../../css/global.css">
        <link rel="stylesheet" href="deposit.css">
        <script src="deposit.js" defer></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    </head>
    <body>
        <div class="container">
            <h2>Depósito</h2>
            <p>Saldo actual: $<span id="saldo">0</span></p>
            <div class="form-group">
                <label for="monto">Monto:</label>
                <input type="number" id="monto" class="form-control">
            </div>

            <button id="depositarBtn" class="btn btn-primary">
                Realizar depósito
            </button>
            <div id="mensaje" class="alert alert-success mt-2" style="display:none;">
                    Se han depositado ...
            </div>
        </div>
    </body>
</html>
