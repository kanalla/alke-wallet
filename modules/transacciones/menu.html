<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Menú Principal</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="menu.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script src="menu.js" defer></script>
</head>

<body>

    <div class="container">

        <h2>Menú Principal</h2>

        <p>Saldo actual:</p>
        <span id="saldo">0</span>
        <div id="menuCarousel" class="carousel slide" data-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <div class="card text-center">
                        <div class="card-body">
                            <h4>Depositar Dinero</h4>
                            <p>
                                Agrega saldo a tu cuenta de forma rápida y segura.
                            </p>
                            <button id="depositarBtn" class="btn btn-primary">
                                Ir a Depósitos
                            </button>
                        </div>
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="card text-center">
                        <div class="card-body">
                            <h4>Enviar Dinero</h4>
                            <p>
                                Realiza transferencias a tus contactos registrados.
                            </p>
                            <button id="enviarBtn" class="btn btn-primary">
                                Ir a Transferencias
                            </button>
                        </div>
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="card text-center">
                        <div class="card-body">
                            <h4>Últimos Movimientos</h4>
                            <p>
                                Consulta el historial reciente de tu cuenta.
                            </p>
                            <button id="movimientosBtn" class="btn btn-primary">
                                Ver Movimientos
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <a class="carousel-control-prev" href="#menuCarousel" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </a>

            <a class="carousel-control-next" href="#menuCarousel" role="button" data-slide="next">
                <span class="carousel-control-next-icon"></span>
            </a>

        </div>

        <div id="redirectionMsg"
             class="alert alert-success mt-3"
             style="display:none;">
        </div>
        <div id="ultimosMovimientos" class="mt-3"></div>
    </div>

</body>
</html>
